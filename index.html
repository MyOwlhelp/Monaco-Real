<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uranium - Luma</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-app: #1c1c1c;
      --bg-header: #252526;
      --bg-terminal: #181818;
      --border: #333333;
      --accent: #00a2ff;
      --text-main: #cccccc;
      --text-muted: #858585;
      
      --log-print: #ffffff;
      --log-warn: #ffcc00;
      --log-error: #ff5555;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- Animations --- */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes tabEnter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes logSlideIn { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: translateX(0); } }

    /* --- Staggered Startup --- */
    .tabs-wrapper { animation: fadeIn 0.3s ease-out forwards; }
    .editor-container { animation: fadeIn 0.4s ease-out 0.1s forwards; opacity: 0; }
    .terminal-section { animation: fadeIn 0.4s ease-out 0.2s forwards; opacity: 0; }

    /* --- Tabs Area --- */
    .tabs-wrapper {
      background-color: var(--bg-header);
      display: flex;
      align-items: center;
      overflow-x: auto;
      scrollbar-width: none;
      height: 38px;
      border-bottom: 1px solid var(--border);
      padding-top: 2px;
      z-index: 10;
    }

    .tab {
      background-color: transparent;
      padding: 0 15px;
      height: 100%;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-right: 1px solid var(--border);
      min-width: 120px;
      max-width: 200px;
      position: relative;
      user-select: none;
      transition: background-color 0.2s;
      animation: tabEnter 0.2s ease-out;
    }

    .tab:hover { background-color: var(--bg-app); color: var(--text-main); }
    
    .tab.active {
      background-color: var(--bg-app);
      color: var(--text-main);
      border-top: 2px solid var(--accent);
    }

    .tab-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .rename-input {
      background: var(--bg-app);
      border: 1px solid var(--accent);
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      width: 80px;
      outline: none;
      padding: 2px 4px;
      border-radius: 2px;
      margin-left: -4px;
    }

    .tab-close {
      margin-left: auto;
      font-size: 14px;
      opacity: 0;
      border-radius: 3px;
      padding: 0 4px;
      transition: opacity 0.2s;
    }
    .tab:hover .tab-close { opacity: 1; }
    .tab-close:hover { background-color: #ff4757; color: white; }

    .add-tab-btn {
      padding: 0 15px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      height: 100%;
      display: flex;
      align-items: center;
    }
    .add-tab-btn:hover { color: var(--text-main); background-color: rgba(255,255,255,0.05); }

    /* --- Editor Area --- */
    .editor-container {
      flex: 1;
      position: relative;
      background-color: var(--bg-app);
    }
    #editor { width: 100%; height: 100%; }

    /* --- Output Terminal --- */
    .terminal-section {
      height: 250px;
      min-height: 32px;
      background-color: var(--bg-terminal);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: relative; /* Needed for absolute positioning of handle */
      /* Transition is handled via JS class now to allow smooth dragging */
    }
    
    .terminal-section.smooth-transition {
      transition: height 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* Resize Handle */
    .resize-handle {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      cursor: ns-resize;
      background-color: transparent;
      z-index: 100;
      transition: background-color 0.2s;
    }

    .resize-handle:hover, .resize-handle.active {
      background-color: var(--accent);
    }

    .term-header {
      padding: 0 15px;
      height: 32px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background-color: #202020;
      user-select: none;
    }

    .term-left-group { display: flex; align-items: center; gap: 15px; }

    .term-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .connection-status {
      font-size: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.03);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #555;
      transition: background-color 0.3s;
    }
    .status-dot.connected { background-color: #4cd137; box-shadow: 0 0 5px rgba(76, 209, 55, 0.5); }
    .status-dot.disconnected { background-color: #e84118; }

    .term-controls i {
      margin-left: 12px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 12px;
      transition: color 0.2s, transform 0.3s;
    }
    .term-controls i:hover { color: var(--text-main); }
    
    .term-output {
      flex: 1;
      padding: 10px 15px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      scroll-behavior: smooth;
    }

    .term-output::-webkit-scrollbar { width: 10px; }
    .term-output::-webkit-scrollbar-track { background: var(--bg-terminal); }
    .term-output::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; border: 2px solid var(--bg-terminal); }
    .term-output::-webkit-scrollbar-thumb:hover { background: #444; }

    .log-entry { 
      margin-bottom: 4px; 
      padding-bottom: 2px;
      word-break: break-all;
      white-space: pre-wrap;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      line-height: 1.4;
      animation: logSlideIn 0.2s ease-out;
    }

    .log-print { color: var(--log-print); }
    .log-warn { color: var(--log-warn); }
    .log-error { color: var(--log-error); }
    .log-sys { color: #00a2ff; font-style: italic; opacity: 0.7; font-size: 12px; }

    /* --- Status Bar --- */
    .status-bar {
      height: 22px;
      background-color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Tabs (Top) -->
  <div class="tabs-wrapper" id="tabs-container">
    <div class="add-tab-btn" id="add-tab">+</div>
  </div>

  <!-- Editor -->
  <div class="editor-container">
    <div id="editor"></div>
  </div>

  <!-- Terminal -->
  <!-- Added class 'smooth-transition' initially -->
  <div class="terminal-section smooth-transition" id="terminal">
    <!-- Resize Handle Added Here -->
    <div class="resize-handle" id="term-resizer"></div>

    <div class="term-header">
      <div class="term-left-group">
        <span class="term-title"><i class="fas fa-terminal"></i> Console</span>
        
        <div class="connection-status">
          <div id="socket-dot" class="status-dot disconnected"></div>
          <span id="socket-status-text">Disconnected</span>
        </div>
      </div>

      <div class="term-controls">
        <i class="fas fa-ban" id="btn-clear" title="Clear Console"></i>
        <i class="fas fa-chevron-down" id="btn-toggle" title="Toggle Size"></i>
      </div>
    </div>
    <div class="term-output" id="output-log">
      <div class="log-entry log-sys">-- Waiting for Luma connection on localhost:48721...</div>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span>Luma Environment</span>
    <span id="cursor-pos">Ln 1, Col 1</span>
  </div>

  <!-- Monaco Editor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>

  <script>
    // --- Global State ---
    let files = {}; 
    let untitledCount = 1;
    let editor;

    // --- Persistence ---
    function saveSession() {
      const activeTab = document.querySelector('.tab.active');
      if (activeTab && editor) {
        files[activeTab.dataset.file] = editor.getValue();
      }
      const tabs = document.querySelectorAll('.tab');
      const tabOrder = Array.from(tabs).map(t => t.dataset.file);

      const sessionData = {
        files: files,
        order: tabOrder,
        activeId: activeTab ? activeTab.dataset.file : null,
        count: untitledCount
      };
      localStorage.setItem('luma_editor_session', JSON.stringify(sessionData));
    }

    function restoreSession() {
      const saved = localStorage.getItem('luma_editor_session');
      if (!saved) {
        createTab('main', `-- Uranium Editor (Luma Mode)
-- Auto-Save Enabled.
-- Drag console top border to resize.

print("Hello Luma!")
`);
        return;
      }

      try {
        const data = JSON.parse(saved);
        files = data.files || {};
        untitledCount = data.count || 1;
        const order = data.order || [];

        if (order.length === 0) {
          createTab('main', 'print("Welcome back")');
          return;
        }

        order.forEach(id => {
          if (files[id] !== undefined) {
             const isActive = (id === data.activeId);
             renderTab(id, isActive);
          }
        });

        if (data.activeId && files[data.activeId]) {
           editor.setValue(files[data.activeId]);
        } else if (order.length > 0) {
           const firstId = order[0];
           const tab = document.querySelector(`.tab[data-file="${firstId}"]`);
           if(tab) tab.classList.add('active');
           editor.setValue(files[firstId]);
        }

      } catch (e) {
        localStorage.removeItem('luma_editor_session');
        createTab('main');
      }
    }

    // --- Monaco Config ---
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});

    require(['vs/editor/editor.main'], function () {
      monaco.languages.register({ id: 'luau' });
      monaco.languages.setMonarchTokensProvider('luau', {
        tokenizer: {
          root: [
            [/\b(function|if|then|else|elseif|end|return|for|while|do|repeat|until|and|or|not|local|nil|false|true|break|in|continue|type|export|typeof)\b/, 'keyword'],
            [/\b(print|warn|error|assert|tonumber|tostring|math|table|string|task|os|debug|getgenv)\b/, 'function'],
            [/"([^"\\]|\\.)*$/, 'string.invalid'],
            [/"/, { token: 'string.quote', bracket: '@open', next: '@string_double' }],
            [/'/, { token: 'string.quote', bracket: '@open', next: '@string_single' }],
            [/\b\d+(\.\d+)?\b/, 'number'],
            [/--.*$/, 'comment'],
          ],
          string_double: [[/[^\\"]+/, 'string'], [/"/, { token: 'string.quote', bracket: '@close', next: '@pop' }]],
          string_single: [[/[^\\']+/, 'string'], [/'/, { token: 'string.quote', bracket: '@close', next: '@pop' }]]
        }
      });

      monaco.editor.defineTheme('uranium-graphite', {
        base: 'vs-dark',
        inherit: true,
        rules: [
          { token: 'keyword', foreground: 'c678dd', fontStyle: 'bold' },
          { token: 'function', foreground: '61afef' },
          { token: 'string', foreground: '98c379' },
          { token: 'number', foreground: 'd19a66' },
          { token: 'comment', foreground: '5c6370', fontStyle: 'italic' },
        ],
        colors: {
          'editor.background': '#1c1c1c',
          'editor.foreground': '#abb2bf',
          'editor.lineHighlightBackground': '#2c313a',
          'editor.selectionBackground': '#3e4451',
          'editorCursor.foreground': '#528bff',
          'editorLineNumber.foreground': '#4b5263',
          'editorIndentGuide.background': '#3b4048'
        }
      });

      editor = monaco.editor.create(document.getElementById('editor'), {
        value: '',
        language: 'luau',
        theme: 'uranium-graphite',
        fontSize: 14,
        fontFamily: "'JetBrains Mono', Consolas, monospace",
        minimap: { enabled: false },
        automaticLayout: true,
        padding: { top: 15 },
        renderLineHighlight: 'all',
        cursorBlinking: 'smooth',
        cursorSmoothCaretAnimation: 'on'
      });

      editor.onDidChangeCursorPosition(e => {
        document.getElementById('cursor-pos').textContent = `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
      });

      editor.onDidChangeModelContent(() => {
        saveSession();
      });

      restoreSession();
    });

    // --- Tab Helper ---
    const tabsContainer = document.getElementById('tabs-container');
    const addTabBtn = document.getElementById('add-tab');

    function renderTab(id, isActive) {
      const newTab = document.createElement('div');
      newTab.className = isActive ? 'tab active' : 'tab';
      newTab.dataset.file = id;
      newTab.innerHTML = `<i class="fas fa-file-code" style="color: #00a2ff; font-size: 11px;"></i><span class="tab-name">${id}.luau</span><span class="tab-close">×</span>`;
      tabsContainer.insertBefore(newTab, addTabBtn);
      
      if(isActive) {
        setTimeout(() => newTab.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
      }
    }

    // --- Interaction Handlers ---
    addTabBtn.addEventListener('click', () => createTab());
    
    tabsContainer.addEventListener('click', (e) => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      if (e.target.tagName === 'INPUT') return; 

      if (e.target.classList.contains('tab-close')) {
        e.stopPropagation();
        closeTab(tab);
      } else {
        switchTab(tab);
      }
    });

    tabsContainer.addEventListener('dblclick', (e) => {
        const tab = e.target.closest('.tab');
        if (!tab || e.target.classList.contains('tab-close')) return;

        const nameSpan = tab.querySelector('.tab-name');
        if(!nameSpan) return; 

        const oldId = tab.dataset.file;
        const currentText = oldId; 

        const input = document.createElement('input');
        input.type = 'text';
        input.value = currentText;
        input.className = 'rename-input';
        
        nameSpan.replaceWith(input);
        input.focus();
        input.select();

        const finishRename = () => {
            const newName = input.value.trim().replace(/[^a-zA-Z0-9_-]/g, '');
            const newSpan = document.createElement('span');
            newSpan.className = 'tab-name';
            
            if (newName && newName !== oldId && !files[newName]) {
                files[newName] = files[oldId];
                delete files[oldId];
                tab.dataset.file = newName;
                newSpan.textContent = newName + '.luau';
                saveSession();
            } else {
                newSpan.textContent = oldId + '.luau';
            }
            
            if(input.parentNode) input.replaceWith(newSpan);
        };

        input.addEventListener('blur', finishRename);
        input.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') input.blur(); 
            else if(e.key === 'Escape') { input.value = oldId; input.blur(); }
        });
    });

    function createTab(name = null, content = null) {
      const current = document.querySelector('.tab.active');
      if(current && editor) files[current.dataset.file] = editor.getValue();

      const id = name ? name : `script${untitledCount++}`;
      if (!files[id]) {
        files[id] = content !== null ? content : `print("New Script ${id}")`;
      }

      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      renderTab(id, true);
      editor.setValue(files[id]);
      saveSession(); 
    }

    function switchTab(tab) {
      const old = document.querySelector('.tab.active');
      if(old && editor) { 
          files[old.dataset.file] = editor.getValue(); 
          old.classList.remove('active'); 
      }
      tab.classList.add('active');
      editor.setValue(files[tab.dataset.file] || "");
      saveSession(); 
    }

    function closeTab(tab) {
      if(document.querySelectorAll('.tab').length === 1) return;
      tab.style.transform = 'scale(0.9)';
      tab.style.opacity = '0';
      tab.style.width = '0';
      tab.style.padding = '0';
      setTimeout(() => {
        delete files[tab.dataset.file];
        if(tab.classList.contains('active')) {
          const target = tab.previousElementSibling || tab.nextElementSibling;
          if(target && target.classList.contains('tab')) switchTab(target);
        }
        tab.remove();
        saveSession();
      }, 200);
    }

    // --- Socket & Output Logic ---
    const outputLog = document.getElementById('output-log');
    const statusText = document.getElementById('socket-status-text');
    const statusDot = document.getElementById('socket-dot');
    let socket = null;

    function log(msg, type = 'print') {
      const div = document.createElement('div');
      let className = 'log-print'; 
      if (type.includes('warn')) className = 'log-warn'; 
      if (type.includes('error') || type.includes('err')) className = 'log-error'; 
      if (type === 'sys') className = 'log-sys'; 

      div.className = `log-entry ${className}`;
      const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric" });
      div.innerText = `[${time}] ${msg}`;
      outputLog.appendChild(div);
      requestAnimationFrame(() => outputLog.scrollTop = outputLog.scrollHeight);
    }

    function connectSocket() {
      socket = new WebSocket("ws://localhost:48721");
      socket.onopen = () => {
        statusText.innerText = "Connected";
        statusDot.classList.remove('disconnected');
        statusDot.classList.add('connected');
        log("Connected to Luma", 'sys');
      };
      socket.onmessage = (event) => {
        const raw = event.data;
        try {
          const data = JSON.parse(raw);
          let type = data.type || data.level || 'print';
          let message = data.message || data.content || data.msg || raw;
          log(message, type);
        } catch (e) {
          let type = 'print';
          if(raw.toLowerCase().startsWith('warn')) type = 'warn';
          if(raw.toLowerCase().startsWith('error')) type = 'error';
          log(raw, type);
        }
      };
      socket.onclose = () => {
        statusText.innerText = "Disconnected";
        statusDot.classList.remove('connected');
        statusDot.classList.add('disconnected');
        setTimeout(connectSocket, 3000);
      };
    }

    connectSocket();

    // --- UI Tools ---
    document.getElementById('btn-clear').addEventListener('click', () => {
      outputLog.innerHTML = '';
    });
    
    // --- Toggle & Resizing Logic ---
    let termOpen = true;
    const terminal = document.getElementById('terminal');
    const resizer = document.getElementById('term-resizer');
    const toggleBtn = document.getElementById('btn-toggle');
    
    // Toggle Button Logic
    toggleBtn.addEventListener('click', function() {
      if(termOpen) {
        // Collapse
        terminal.classList.add('smooth-transition'); // Enable animation
        terminal.style.height = '32px'; 
        this.style.transform = 'rotate(180deg)';
      } else {
        // Expand
        terminal.classList.add('smooth-transition'); // Enable animation
        terminal.style.height = '250px';
        this.style.transform = 'rotate(0deg)';
      }
      termOpen = !termOpen;
      setTimeout(() => editor.layout(), 310);
    });

    // --- Resize Dragging Logic ---
    let isResizing = false;
    let startY, startHeight;

    resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        startY = e.clientY;
        startHeight = parseInt(getComputedStyle(terminal).height, 10);
        
        // Disable transition during drag to prevent lag
        terminal.classList.remove('smooth-transition');
        resizer.classList.add('active');
        document.body.style.cursor = 'ns-resize';
        document.body.style.userSelect = 'none'; // Prevent text selection
    });

    document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;

        // Calculate delta (Moving mouse UP increases height, DOWN decreases)
        const delta = startY - e.clientY;
        const newHeight = startHeight + delta;

        // Constraints
        if (newHeight > 32 && newHeight < window.innerHeight - 50) {
            terminal.style.height = `${newHeight}px`;
            editor.layout(); // Important: Redraw Monaco immediately
            
            // Update state variable based on height
            if (newHeight > 40 && !termOpen) {
                termOpen = true;
                toggleBtn.style.transform = 'rotate(0deg)';
            }
        }
    });

    document.addEventListener('mouseup', () => {
        if (isResizing) {
            isResizing = false;
            // Re-enable smooth transition for future toggles
            terminal.classList.add('smooth-transition');
            resizer.classList.remove('active');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        }
    });

  </script>
</body>
</html>
