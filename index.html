<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luma Editor</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-app: #1e1e1e;
      --bg-header: #252526;
      --bg-terminal: #1e1e1e;
      --border: #333333;
      --accent: #007acc;
      --text-main: #cccccc;
      --text-muted: #858585;
      
      --log-print: #e0e0e0;
      --log-warn: #cca700;
      --log-error: #f48771;
      --log-sys: #00a2ff;

      --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none; 
    }

    /* --- Animations --- */
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes tabOpen {
      from { opacity: 0; transform: scale(0.95) translateY(5px); width: 0; padding: 0; }
      to { opacity: 1; transform: scale(1) translateY(0); width: 140px; padding: 0 12px; }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(76, 209, 55, 0.4); }
      70% { box-shadow: 0 0 0 4px rgba(76, 209, 55, 0); }
      100% { box-shadow: 0 0 0 0 rgba(76, 209, 55, 0); }
    }

    @keyframes menuPop {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* --- Tabs Area --- */
    .tabs-wrapper {
      background-color: var(--bg-header);
      display: flex;
      align-items: flex-end;
      overflow-x: auto;
      scrollbar-width: none;
      height: 42px;
      min-height: 42px;
      padding: 0 10px;
      padding-top: 6px;
      z-index: 20;
      animation: slideUpFade 0.5s var(--ease-smooth);
      scroll-behavior: smooth;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }

    .tab {
      background-color: transparent;
      padding: 0 12px;
      height: 36px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 10px 10px 0 0;
      margin-right: 4px;
      border: 1px solid transparent;
      min-width: 140px;
      max-width: 200px;
      position: relative;
      transition: background 0.2s, color 0.2s, transform 0.2s;
      animation: tabOpen 0.3s var(--ease-spring) forwards;
      transform-origin: bottom center;
      flex-shrink: 0;
    }

    .tab.closing {
      width: 0 !important;
      min-width: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      opacity: 0;
      transform: scaleX(0);
      pointer-events: none;
      transition: all 0.25s var(--ease-smooth);
    }

    .tab:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); }
    
    .tab.active {
      background-color: var(--bg-app);
      color: #fff;
      border-top: 2px solid var(--accent);
      height: 37px;
      margin-bottom: -1px; 
      z-index: 2;
    }

    .tab-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; flex: 1; }

    .rename-input {
      background: #3c3c3c;
      border: 1px solid var(--accent);
      color: white;
      font-family: inherit;
      font-size: 12px;
      width: 100%;
      outline: none;
      padding: 2px 4px;
      border-radius: 6px;
    }

    .tab-close {
      font-size: 12px;
      opacity: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transform: scale(0.8);
      transition: all 0.2s var(--ease-spring);
    }
    .tab:hover .tab-close { opacity: 1; transform: scale(1); }
    .tab-close:hover { background-color: rgba(241, 76, 76, 0.2); color: #ff5555; }

    .add-tab-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      border-radius: 8px;
      margin-left: 5px;
      margin-bottom: 2px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .add-tab-btn:hover { color: #fff; background-color: rgba(255,255,255,0.08); transform: rotate(90deg); }

    /* --- Editor --- */
    .editor-container {
      flex: 1;
      position: relative;
      background-color: var(--bg-app);
      overflow: hidden;
      opacity: 0;
      border-top: 1px solid var(--border);
      animation: slideUpFade 0.6s 0.1s var(--ease-smooth) forwards;
    }
    #editor { width: 100%; height: 100%; }

    /* --- Terminal --- */
    .terminal-section {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      background-color: var(--bg-terminal);
      border-radius: 12px 12px 0 0;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 0 -4px 25px rgba(0,0,0,0.4);
      animation: slideUpFade 0.6s 0.2s var(--ease-smooth) forwards;
      opacity: 0;
    }
    .terminal-section.smooth { transition: height 0.4s var(--ease-spring); }

    .resize-handle {
      position: absolute;
      top: -6px; left: 0; right: 0;
      height: 12px;
      cursor: ns-resize;
      z-index: 100;
    }
    .resize-handle:hover { background: rgba(255,255,255,0.05); }

    .term-header {
      padding: 0 15px;
      height: 32px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #202020;
      border-bottom: 1px solid var(--border);
      border-radius: 12px 12px 0 0;
      user-select: none;
    }
    .term-left { display: flex; align-items: center; gap: 15px; }
    .term-right { display: flex; align-items: center; gap: 15px; }

    .term-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cursor-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.8;
      border-right: 1px solid rgba(255,255,255,0.1);
      padding-right: 15px;
    }

    .connection-status {
      font-size: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.04);
      padding: 3px 10px;
      border-radius: 12px;
      transition: background 0.3s;
    }
    .connection-status:hover { background: rgba(255,255,255,0.08); }

    .status-dot { width: 6px; height: 6px; border-radius: 50%; transition: background 0.3s; }
    .status-dot.connected { background-color: #4cd137; animation: pulse 2s infinite; }
    .status-dot.disconnected { background-color: #e84118; }

    .term-controls i {
      margin-left: 10px;
      padding: 6px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 12px;
      transition: all 0.2s;
      border-radius: 6px;
    }
    .term-controls i:hover { color: #fff; background: rgba(255,255,255,0.1); transform: scale(1.1); }

    .term-output {
      flex: 1;
      padding: 10px 15px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      scroll-behavior: smooth;
      user-select: text; 
      -webkit-user-select: text;
      cursor: text;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background-color: #555; }

    .log-entry { 
      margin-bottom: 4px;
      word-break: break-all;
      white-space: pre-wrap;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      line-height: 1.5;
      padding-bottom: 2px;
      animation: slideUpFade 0.3s var(--ease-smooth);
    }
    .log-print { color: var(--log-print); }
    .log-warn { color: var(--log-warn); }
    .log-error { color: var(--log-error); }
    .log-sys { color: var(--log-sys); font-style: italic; font-size: 12px; }

    /* --- Context Menu --- */
    #context-menu {
      position: absolute;
      background: rgba(45, 45, 45, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 12px;
      display: none;
      z-index: 2000;
      width: 150px;
      padding: 6px;
      transform-origin: top left;
      animation: menuPop 0.15s var(--ease-spring);
    }
    .ctx-item {
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text-main);
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.1s;
    }
    .ctx-item:hover { background-color: var(--accent); color: white; }
    .ctx-sep { height: 1px; background: rgba(255,255,255,0.1); margin: 4px 0; }
  </style>
</head>
<body>

  <div class="tabs-wrapper" id="tabs-container">
    <div class="add-tab-btn" id="add-tab" title="New Tab"><i class="fas fa-plus"></i></div>
  </div>

  <div class="editor-container">
    <div id="editor"></div>
  </div>

  <div class="terminal-section smooth" id="terminal">
    <div class="resize-handle" id="term-resizer"></div>
    <div class="term-header">
      <div class="term-left">
        <span class="term-title"><i class="fas fa-terminal"></i> Console</span>
        <div class="connection-status">
          <div id="socket-dot" class="status-dot disconnected"></div>
          <span id="socket-status-text">Disconnected</span>
        </div>
      </div>
      <div class="term-right">
        <span id="cursor-pos" class="cursor-info">Ln 1, Col 1</span>
        <div class="term-controls">
          <i class="fas fa-ban" id="btn-clear" title="Clear Output"></i>
          <i class="fas fa-chevron-down" id="btn-toggle" title="Toggle Size"></i>
        </div>
      </div>
    </div>
    <div class="term-output" id="output-log">
      <!-- Logs will appear here -->
    </div>
  </div>

  <div id="context-menu">
    <div class="ctx-item" id="ctx-rename"><i class="fas fa-pen" style="margin-right:8px; opacity:0.7;"></i> Rename</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" id="ctx-close"><i class="fas fa-times" style="margin-right:8px; opacity:0.7;"></i> Close</div>
    <div class="ctx-item" id="ctx-close-others">Close Others</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>

  <script>
    let files = {}; 
    let editor;
    let socket = null;
    let ctxTargetTab = null;
    let activeTabId = null;
    let isSilent = false;

    // --- Tab Scroll Logic ---
    const tabsContainer = document.getElementById('tabs-container');
    tabsContainer.addEventListener('wheel', (e) => {
        if (e.deltaY !== 0) {
            e.preventDefault();
            tabsContainer.scrollLeft += e.deltaY;
        }
    });

    function saveSession() {
      // 1. Save currently active tab content to memory
      if (activeTabId && files[activeTabId] !== undefined && editor && !isSilent) {
        files[activeTabId] = editor.getValue();
      }

      // 2. Persist to storage
      const tabOrder = Array.from(document.querySelectorAll('.tab:not(.closing)')).map(t => t.dataset.file);
      const sessionData = {
        files: files,
        order: tabOrder,
        activeId: activeTabId
      };
      localStorage.setItem('luma_editor_session', JSON.stringify(sessionData));
    }

    function restoreSession() {
      const saved = localStorage.getItem('luma_editor_session');
      if (!saved) {
        createTab('Script1', 'print("Hello, world!")');
        return;
      }
      try {
        const data = JSON.parse(saved);
        files = data.files || {};
        const order = data.order || [];

        if (order.length === 0) {
          createTab('Script1', 'print("Welcome back")');
          return;
        }

        order.forEach(id => {
          if (files[id] !== undefined) renderTab(id, id === data.activeId);
        });

        const targetId = data.activeId || order[0];
        activeTabId = targetId;

        document.querySelectorAll('.tab').forEach(t => {
            if(t.dataset.file === activeTabId) t.classList.add('active');
            else t.classList.remove('active');
        });

        if (files[activeTabId] && editor) {
             setTimeout(() => {
                isSilent = true;
                editor.setValue(files[activeTabId]);
                isSilent = false;
             }, 50);
        }
      } catch (e) {
        console.error(e);
        localStorage.removeItem('luma_editor_session');
        createTab('Script1');
      }
    }

    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});

    require(['vs/editor/editor.main'], function () {
      monaco.languages.register({ id: 'luau' });

      const exploitEnv = [
        'readfile','writefile','appendfile','loadfile','listfiles','isfile','isfolder','makefolder','delfolder','delfile',
        'getrawmetatable','setrawmetatable','setreadonly','isreadonly','isstruct','getnamecallmethod','setnamecallmethod','hookmetamethod','newcclosure','hookfunction',
        'fireclickdetector','firetouchinterest','fireproximityprompt','getconnections','getnilinstances','getinstances','getplayers',
        'getgenv','getrenv','getreg','getgc','getloadedmodules','checkcaller','clonefunction','islclosure','iscclosure','loadstring','identifyexecutor','getscriptbytecode','getscripthash',
        'keypress','keyrelease','mouse1click','mouse1press','mouse1release','mouse2click','mouse2press','mouse2release','mousemoveabs','mousemoverel',
        'rconsoleprint','rconsolewarn','rconsoleerr','rconsoleclear','rconsolename','setclipboard','toclipboard','lz4compress','lz4decompress','messagebox','setfpscap','getfpscap',
        'Drawing','cleardrawcache','isrenderobj','getrenderproperty','setrenderproperty'
      ];

      monaco.languages.registerCompletionItemProvider('luau', {
        provideCompletionItems: (model, position) => {
          const suggestions = [
            { label: 'Players', kind: monaco.languages.CompletionItemKind.Class, insertText: 'game:GetService("Players")' },
            { label: 'ReplicatedStorage', kind: monaco.languages.CompletionItemKind.Class, insertText: 'game:GetService("ReplicatedStorage")' },
            { label: 'UserInputService', kind: monaco.languages.CompletionItemKind.Class, insertText: 'game:GetService("UserInputService")' },
            { label: 'TweenService', kind: monaco.languages.CompletionItemKind.Class, insertText: 'game:GetService("TweenService")' },
            { label: 'RunService', kind: monaco.languages.CompletionItemKind.Class, insertText: 'game:GetService("RunService")' },
            { label: 'HttpService', kind: monaco.languages.CompletionItemKind.Class, insertText: 'game:GetService("HttpService")' },
            { label: 'Workspace', kind: monaco.languages.CompletionItemKind.Class, insertText: 'game:GetService("Workspace")' },
            { label: 'CoreGui', kind: monaco.languages.CompletionItemKind.Class, insertText: 'game:GetService("CoreGui")' },
            { label: 'game', kind: monaco.languages.CompletionItemKind.Module, insertText: 'game' },
            { label: 'workspace', kind: monaco.languages.CompletionItemKind.Module, insertText: 'workspace' },
            { label: 'task.wait', kind: monaco.languages.CompletionItemKind.Function, insertText: 'task.wait(${1})', insertTextRules: 4 },
            { label: 'print', kind: monaco.languages.CompletionItemKind.Function, insertText: 'print("${1}")', insertTextRules: 4 },
          ];

          exploitEnv.forEach(func => {
              suggestions.push({
                  label: func,
                  kind: monaco.languages.CompletionItemKind.Function,
                  insertText: func,
                  detail: 'Exploit Environment'
              });
          });

          return { suggestions: suggestions };
        }
      });

      const exploitRegex = new RegExp(`\\b(${exploitEnv.join('|')})\\b`);

      monaco.languages.setMonarchTokensProvider('luau', {
        tokenizer: {
          root: [
            [/--.*$/, 'comment'],
            [/\b(function|if|then|else|elseif|end|return|for|while|do|repeat|until|and|or|not|local|nil|false|true|break|in|continue|type|export|typeof)\b/, 'keyword'],
            [/\b(print|warn|error|assert|collectgarbage|require|dofile|getfenv|setfenv|ipairs|pairs|next|pcall|xpcall|select|tonumber|tostring|type|unpack|_VERSION|game|workspace|delay|spawn|elapsedTime|time|tick|settings|shared|_G|math|table|string|coroutine|os|debug|task|bit32|utf8)\b/, 'builtin.blue'],
            [exploitRegex, 'builtin.blue'],
            [/[a-zA-Z_]\w*(?=\s*\()/, 'function.call'],
            [/"([^"\\]|\\.)*$/, 'string.invalid'],
            [/"/, { token: 'string.quote', bracket: '@open', next: '@string_double' }],
            [/'/, { token: 'string.quote', bracket: '@open', next: '@string_single' }],
            [/\b\d+(\.\d+)?\b/, 'number'],
            [/[a-zA-Z_]\w*/, 'identifier'],
          ],
          string_double: [[/[^\\"]+/, 'string'], [/"/, { token: 'string.quote', bracket: '@close', next: '@pop' }]],
          string_single: [[/[^\\']+/, 'string'], [/'/, { token: 'string.quote', bracket: '@close', next: '@pop' }]]
        }
      });

      monaco.editor.defineTheme('uranium-graphite', {
        base: 'vs-dark',
        inherit: true,
        rules: [
          { token: 'keyword', foreground: 'C586C0' },
          { token: 'builtin.blue', foreground: '66d9ef' },
          { token: 'function.call', foreground: 'DCDCAA' },
          { token: 'identifier', foreground: 'd4d4d4' },
          { token: 'string', foreground: 'CE9178' },
          { token: 'number', foreground: 'B5CEA8' },
          { token: 'comment', foreground: '6A9955', fontStyle: 'italic' },
        ],
        colors: {
          'editor.background': '#1e1e1e',
          'editor.foreground': '#d4d4d4',
          'editor.lineHighlightBackground': '#2f333d',
          'editor.selectionBackground': '#264f78',
          'editorCursor.foreground': '#ffffff',
          'editorLineNumber.foreground': '#858585',
          'editorIndentGuide.background': '#404040'
        }
      });

      editor = monaco.editor.create(document.getElementById('editor'), {
        value: '',
        language: 'luau',
        theme: 'uranium-graphite',
        fontSize: 14,
        fontFamily: "'JetBrains Mono', Consolas, monospace",
        minimap: { enabled: true, renderCharacters: false },
        automaticLayout: true,
        padding: { top: 15 },
        cursorBlinking: 'smooth',
        cursorSmoothCaretAnimation: 'on',
        smoothScrolling: true
      });

      editor.onDidChangeCursorPosition(e => {
        document.getElementById('cursor-pos').textContent = `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
      });
      editor.onDidChangeModelContent(() => { saveSession(); });
      restoreSession();
    });

    const addTabBtn = document.getElementById('add-tab');

    function renderTab(id, isActive) {
      const newTab = document.createElement('div');
      newTab.className = isActive ? 'tab active' : 'tab';
      newTab.dataset.file = id;
      newTab.innerHTML = `<i class="fas fa-file-code" style="color: #007acc; font-size: 11px;"></i><span class="tab-name">${id}.luau</span><span class="tab-close"><i class="fas fa-times"></i></span>`;
      tabsContainer.insertBefore(newTab, addTabBtn);
      if(isActive) setTimeout(() => newTab.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
    }

    addTabBtn.addEventListener('click', () => createTab());

    function getNextScriptName() {
      let i = 1;
      while (files[`Script${i}`] !== undefined) {
        i++;
      }
      return `Script${i}`;
    }

    function createTab(name = null, content = null) {
      if(activeTabId && files[activeTabId] !== undefined && editor) {
          files[activeTabId] = editor.getValue();
      }
      
      const id = name ? name : getNextScriptName();
      
      if (!files[id]) files[id] = content !== null ? content : `print("New Script ${id}")`;
      
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      renderTab(id, true);
      
      activeTabId = id;
      
      isSilent = true;
      editor.setValue(files[id]);
      isSilent = false;
      
      saveSession(); 
    }

    function switchTab(tab) {
      const newId = tab.dataset.file;
      if(activeTabId === newId) return;

      if(activeTabId && files[activeTabId] !== undefined && editor) {
          files[activeTabId] = editor.getValue();
          const old = document.querySelector(`.tab[data-file="${activeTabId}"]`);
          if(old) old.classList.remove('active');
      }

      tab.classList.add('active');
      activeTabId = newId;

      isSilent = true;
      editor.setValue(files[activeTabId] || "");
      isSilent = false;
      
      saveSession(); 
    }

    function closeTab(tab) {
      const id = tab.dataset.file;
      if(document.querySelectorAll('.tab:not(.closing)').length === 1) return;
      
      tab.classList.add('closing');
      
      if(id === activeTabId) {
        let target = tab.previousElementSibling;
        if (!target || !target.classList.contains('tab')) target = tab.nextElementSibling;
        
        if(target && target.classList.contains('tab') && !target.classList.contains('closing')) {
           activeTabId = target.dataset.file;
           target.classList.add('active');
           isSilent = true;
           editor.setValue(files[activeTabId] || "");
           isSilent = false;
        }
      }

      delete files[id];
      saveSession();
      setTimeout(() => tab.remove(), 250);
    }

    function renameTab(tab) {
        const nameSpan = tab.querySelector('.tab-name');
        const oldId = tab.dataset.file;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = oldId;
        input.className = 'rename-input';
        nameSpan.replaceWith(input);
        input.focus();
        input.select();
        const finish = () => {
            const newName = input.value.trim().replace(/[^a-zA-Z0-9_-]/g, '');
            const newSpan = document.createElement('span');
            newSpan.className = 'tab-name';
            
            if (newName && newName !== oldId) {
                if(!files[newName]) {
                    files[newName] = files[oldId];
                    delete files[oldId];
                    tab.dataset.file = newName;
                    newSpan.textContent = newName + '.luau';
                    if(activeTabId === oldId) activeTabId = newName;
                    saveSession();
                } else {
                    newSpan.textContent = oldId + '.luau';
                }
            } else { 
                newSpan.textContent = oldId + '.luau'; 
            }
            
            if(input.parentNode) input.replaceWith(newSpan);
        };
        input.addEventListener('blur', finish);
        input.addEventListener('keydown', (e) => { if(e.key === 'Enter') finish(); if(e.key === 'Escape') { input.value = oldId; finish(); } });
    }

    tabsContainer.addEventListener('mousedown', (e) => {
        const tab = e.target.closest('.tab');
        if(!tab) return;
        if (e.button === 0) {
            if (e.target.closest('.tab-close')) closeTab(tab);
            else switchTab(tab);
        } else if (e.button === 2) {
            e.preventDefault();
            ctxTargetTab = tab;
            showContextMenu(e.clientX, e.clientY);
        }
    });

    tabsContainer.addEventListener('dblclick', (e) => {
        const tab = e.target.closest('.tab');
        if(tab && !e.target.closest('.tab-close')) renameTab(tab);
    });

    const ctxMenu = document.getElementById('context-menu');
    function showContextMenu(x, y) { ctxMenu.style.left = x + 'px'; ctxMenu.style.top = y + 'px'; ctxMenu.style.display = 'block'; }
    document.addEventListener('click', (e) => { if(!ctxMenu.contains(e.target)) ctxMenu.style.display = 'none'; });
    document.getElementById('ctx-rename').addEventListener('click', () => { if(ctxTargetTab) renameTab(ctxTargetTab); });
    document.getElementById('ctx-close').addEventListener('click', () => { if(ctxTargetTab) closeTab(ctxTargetTab); });
    document.getElementById('ctx-close-others').addEventListener('click', () => {
        if(!ctxTargetTab) return;
        document.querySelectorAll('.tab').forEach(t => { if(t !== ctxTargetTab) closeTab(t); });
        switchTab(ctxTargetTab);
    });

    const outputLog = document.getElementById('output-log');
    const statusText = document.getElementById('socket-status-text');
    const statusDot = document.getElementById('socket-dot');
    
    // CHANGED: Logic updated to include [Type] in the prefix
    function log(msg, type = 'print') {
      const div = document.createElement('div');
      div.className = `log-entry log-${type}`;
      
      const time = new Date().toLocaleTimeString('en-US', { hour12: false });
      
      // Map the internal type to a display label
      let typeLabel = 'Info'; // Default for 'print'
      if(type === 'warn') typeLabel = 'Warn';
      else if(type === 'error') typeLabel = 'Error';
      else if(type === 'sys') typeLabel = 'System';
      
      div.innerText = `[${time}][${typeLabel}] ${msg}`;
      
      outputLog.appendChild(div);
      outputLog.scrollTop = outputLog.scrollHeight;
    }

    function connectSocket() {
      socket = new WebSocket("ws://localhost:48721");
      socket.onopen = () => { statusText.innerText = "Connected"; statusDot.className = 'status-dot connected'; log("Luma Connected", 'sys'); };
      socket.onmessage = (event) => { try { const data = JSON.parse(event.data); log(data.message || event.data, data.type || 'print'); } catch { log(event.data, 'print'); } };
      socket.onclose = () => { statusText.innerText = "Disconnected"; statusDot.className = 'status-dot disconnected'; setTimeout(connectSocket, 3000); };
    }
    // Start with a system message
    log("Waiting for connection...", "sys");
    connectSocket();
    
    document.getElementById('btn-clear').addEventListener('click', () => outputLog.innerHTML = '');

    const terminal = document.getElementById('terminal');
    const toggleBtn = document.getElementById('btn-toggle');
    const resizer = document.getElementById('term-resizer');
    let termOpen = true;

    toggleBtn.addEventListener('click', () => {
        terminal.classList.add('smooth');
        if(termOpen) { terminal.style.height = '32px'; toggleBtn.className = 'fas fa-chevron-up'; } 
        else { terminal.style.height = '200px'; toggleBtn.className = 'fas fa-chevron-down'; }
        termOpen = !termOpen;
    });

    let isResizing = false;
    let startY, startH;
    resizer.addEventListener('mousedown', (e) => { isResizing = true; startY = e.clientY; startH = parseInt(getComputedStyle(terminal).height); terminal.classList.remove('smooth'); document.body.style.cursor = 'ns-resize'; });
    window.addEventListener('mousemove', (e) => { if(!isResizing) return; const newH = startH + (startY - e.clientY); if(newH > 32 && newH < window.innerHeight * 0.9) { terminal.style.height = newH + 'px'; if(newH > 40 && !termOpen) { termOpen = true; toggleBtn.className = 'fas fa-chevron-down'; } } });
    window.addEventListener('mouseup', () => { isResizing = false; document.body.style.cursor = ''; });
  </script>
</body>
</html>
